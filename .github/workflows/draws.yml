name: update-draws
# [중지] 2026-11-04 동행복권 사이트 이용약관(2025.07.29 시행) 제12조 ①항 1호·9호
#   "비정상적인 방법으로 서비스를 이용하거나 시스템에 접근하는 행위", "특정 기능을 반복적 또는 규칙적으로 호출하는 행위"
#   에 해당할 수 있어 예약 실행과 자동 실행을 모두 끔. 1249회부터 당첨번호는 앱에서 직접 입력.
#   동행복권의 명시적 허락(공식 API·제공 동의)을 받기 전까지 다시 켜지 않음.
# 아래 수동 실행도 허락 없이는 쓰지 않음 (수집기에 ALLOW_DHLOTTERY_FETCH=yes 가 없으면 즉시 종료)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: '사용 중지됨. 동행복권 허락을 받은 경우에만'
        default: 'update'
permissions:
  contents: write
concurrency:
  group: update-draws
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 당첨번호 수집 (실패 시 중단)
        run: node tools/fetch_draws.mjs "${{ github.event.inputs.mode || 'update' }}"
        env:
          ALLOW_DHLOTTERY_FETCH: 'no'
      - name: 통계 과거 검증 다시 계산
        run: node tools/backtest.mjs
      - name: 테스트 (실패 시 중단)
        run: node --test
      - name: 바뀐 경우에만 커밋
        id: commit
        run: |
          if git diff --quiet -- draws/; then echo "변경 없음"; echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add draws/
          git commit -m "당첨번호 자동 갱신 $(date -u +%F)"
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: 실제 배포 주소에서 다시 확인
        if: steps.commit.outputs.changed == '1'
        run: |
          WANT=$(node -e "const d=require('./draws/lotto645.json');console.log(d.count+' '+d.latest)")
          URL="https://kgun1981-web.github.io/dada-lotto-room/draws/lotto645.json"
          for i in $(seq 1 40); do
            GOT=$(curl -fsS "$URL?check=$(date +%s)" | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{try{const d=JSON.parse(s);console.log(d.count+' '+d.latest)}catch{console.log('bad')}})" || echo "fail")
            echo "기대 $WANT / 배포본 $GOT"
            [ "$GOT" = "$WANT" ] && exit 0
            sleep 15
          done
          echo "배포본 확인 실패: 10분 안에 배포 주소에 반영되지 않음"; exit 1
