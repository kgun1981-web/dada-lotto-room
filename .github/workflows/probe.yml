name: probe-dhlottery
# 공식 사이트 데이터 제공 방식 1회 확인 (이 파일이 바뀔 때만 실행)
on:
  push:
    paths: ['.github/workflows/probe.yml', 'tools/probe_dhlottery.sh']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/probe_dhlottery.sh
      - name: 결과를 probe-output 브랜치에 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan probe-output
          git rm -rfq --cached . >/dev/null
          git add -f probe-output.txt
          git commit -qm "probe output $(date -u +%FT%TZ)"
          git push -f origin probe-output
