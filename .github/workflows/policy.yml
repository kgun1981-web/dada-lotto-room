name: policy-check
# 동행복권 robots.txt·이용약관 확인 (1회용 기록. 확인 후 삭제)
on:
  push:
    paths: ['.github/workflows/policy.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: robots.txt
        run: |
          UA="Mozilla/5.0 (compatible; dada-lotto-room/1.0; personal weekly check; +https://github.com/kgun1981-web/dada-lotto-room)"
          echo "확인 시각(UTC): $(date -u +%FT%TZ)"; echo "User-Agent: $UA"
          curl -sS -A "$UA" -o robots.txt -w "HTTP %{http_code} %{content_type}\n" https://www.dhlottery.co.kr/robots.txt
          echo "----- robots.txt (앞 3000자) -----"; head -c 3000 robots.txt; echo
      - name: 이용약관
        run: |
          sleep 2
          UA="Mozilla/5.0 (compatible; dada-lotto-room/1.0; personal weekly check; +https://github.com/kgun1981-web/dada-lotto-room)"
          curl -sS -A "$UA" -o trms.html -w "HTTP %{http_code}\n" https://www.dhlottery.co.kr/trms/home
          python3 - <<'PY'
          import re, html
          s = open('trms.html', encoding='utf-8', errors='ignore').read()
          t = html.unescape(re.sub(r'<script.*?</script>|<style.*?</style>', ' ', s, flags=re.S))
          t = re.sub(r'<[^>]+>', ' ', t); t = re.sub(r'\s+', ' ', t)
          print('약관 본문 길이:', len(t))
          for m in re.finditer(r'시행|부칙', t):
              print('[시행/부칙]', t[max(0, m.start()-60):m.end()+80]); break
          kws = ['자동', '크롤', '스크래', '로봇', '프로그램', '매크로', '복제', '가공', '재배포', '배포', '상업', '영리', '부하', '무단', '수집']
          seen = set()
          for k in kws:
              for m in re.finditer(k, t):
                  a = max(0, m.start() - 150); key = a // 200
                  if key in seen: continue
                  seen.add(key)
                  print(f'[{k}]', t[a:m.end() + 150])
          PY
